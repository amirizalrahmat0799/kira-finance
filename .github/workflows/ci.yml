name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kira
          POSTGRES_USER: kira
          POSTGRES_PASSWORD: kira
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kira -d kira"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KIRA_TEST_DB_URL: jdbc:postgresql://localhost:5432/kira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (unit + integration against PostgreSQL)
        run: mvn -B verify
      - name: Build Docker image
        run: docker build -t kira-api .

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
