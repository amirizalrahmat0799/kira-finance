# Weekly dependency updates, grouped into one PR per ecosystem so CI checks them together.
# Major upgrades (e.g. Spring Boot 4, a new Node or Java base image) are ignored here and done deliberately by hand.
# Expo-managed packages are skipped: they move together with the Expo SDK (npx expo install --fix).
version: 2
updates:
  - package-ecosystem: maven
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      backend-maven:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      backend-docker:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/mobile"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      mobile-npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "@types/react"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
